<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | GeoDeforest AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; }
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      border-radius: 1rem;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="card p-4" style="min-width:350px;">
<h2 class="mb-3 text-center" style="color: #000;">Login</h2>      <form method="POST" action="/login">
        <div class="mb-3">
          <label for="email" class="form-label">Email address</label>
          <input type="email" class="form-control" id="email" name="email" required autofocus>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" name="password" required>
        </div>
        <div class="d-grid mb-2">
          <button type="submit" class="btn btn-dark btn-lg custom-btn-black">Login</button>
        </div>
        <div class="text-center">
          <small>Don't have an account? <a href="/signup">Sign up</a></small>
        </div>
      </form>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
