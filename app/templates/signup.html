<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up | GeoDeforest AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; }
    .signup-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      border-radius: 1rem;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
  </style>
</head>
<body>
  <div class="signup-container">
    <div class="card p-4" style="min-width:350px;">
      <h2 class="mb-3 text-center" style="color: #000;">Sign Up</h2>
      <form method="POST" action="/signup">
        <div class="mb-3">
          <label for="name" class="form-label">Full Name</label>
          <input type="text" class="form-control" id="name" name="name" required autofocus>
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email address</label>
          <input type="email" class="form-control" id="email" name="email" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" name="password" required>
        </div>
        <div class="d-grid mb-2">
          <button type="submit" class="btn btn-dark btn-lg custom-btn-black">Sign Up</button>
        </div>
        <div class="text-center">
          <small>Already have an account? <a href="/login">Login</a></small>
        </div>
      </form>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
